name: Android Build

# Debug APK built entirely in the cloud (no local Node/Android Studio needed).
#
# DEV NOTE — testing against a backend on your PC (127.0.0.1:8001):
#   1. Plug the phone in via USB with USB debugging on.
#   2. Run on the PC:  adb reverse tcp:8001 tcp:8001
#      (re-run after every reconnect; it is not persistent)
#   3. Leave the VITE_API_BASE secret empty so the app uses http://127.0.0.1:8001/api/v1
#   4. Run this workflow with allow_cleartext = true (plain http is blocked by
#      Android by default), and make sure the backend CORS allows the app
#      origin (https://localhost and/or http://localhost for Capacitor).
# For a remote/HTTPS backend: set VITE_API_BASE and keep allow_cleartext = false.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_cleartext:
        description: "Allow http:// traffic (debug / adb reverse only)"
        type: boolean
        default: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build web assets
        run: npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Allow cleartext traffic (debug only)
        if: ${{ inputs.allow_cleartext == true }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi
          grep -n 'usesCleartextTraffic' "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifevault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
