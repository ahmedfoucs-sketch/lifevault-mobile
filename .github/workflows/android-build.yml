name: Android Build

on:
  workflow_dispatch:
    inputs:
      allow_cleartext:
        description: "Allow HTTP traffic for a temporary debug build only"
        type: boolean
        default: false
  push:
    branches:
      - personal-commander-phase0-audit

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Verify project files
        run: |
          for f in index.html package.json vite.config.ts capacitor.config.ts src/main.ts src/App.vue; do
            if [ ! -f "$f" ]; then
              echo "::error::MISSING FILE: $f"
              exit 1
            fi
          done

      - name: Require production API URL
        env:
          LIFEVAULT_API_BASE: ${{ vars.LIFEVAULT_API_BASE }}
        run: |
          if [ -z "$LIFEVAULT_API_BASE" ]; then
            echo "::error::Set the repository Actions variable LIFEVAULT_API_BASE to the public HTTPS API base ending in /api/v1."
            exit 1
          fi
          case "$LIFEVAULT_API_BASE" in
            https://*) ;;
            *) echo "::error::LIFEVAULT_API_BASE must use HTTPS."; exit 1 ;;
          esac

      - name: Build web assets
        env:
          VITE_API_BASE: ${{ vars.LIFEVAULT_API_BASE }}
          VITE_ALLOW_INSECURE: ${{ inputs.allow_cleartext }}
        run: npm run build

      - name: Add Android platform when absent
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Allow cleartext traffic (debug only)
        if: ${{ inputs.allow_cleartext == true }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifevault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
