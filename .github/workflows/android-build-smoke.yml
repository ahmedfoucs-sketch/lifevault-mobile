name: LifeVault Android Build Smoke (No Backend)

on:
  push:
    branches:
      - 'hardening/*'

permissions:
  contents: read

jobs:
  android-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21 (Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate lockfile and install exact dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Build web assets with non-routable test API
        env:
          VITE_API_BASE: https://api.invalid.example/api/v1
        run: npm run build

      - name: Generate Android platform when absent
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor plugins and assets
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload non-production Android smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: lifevault-android-smoke-no-backend
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
