name: LifeVault CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, lifevault-premium-ui, 'personal-commander-*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript and Vue type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
