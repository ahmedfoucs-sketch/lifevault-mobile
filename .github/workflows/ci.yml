name: LifeVault CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, lifevault-premium-ui, 'personal-commander-*', 'hardening/*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile for reproducible install
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependency graph
        run: npm ci
      - name: Report dependency audit summary
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); const v=Object.entries(a.vulnerabilities||{}).map(([name,x])=>({name,severity:x.severity,range:x.range,fixAvailable:x.fixAvailable,via:(x.via||[]).map(y=>typeof y==="string"?y:{name:y.name,title:y.title,url:y.url,range:y.range,severity:y.severity})})); console.log(JSON.stringify({counts:a.metadata?.vulnerabilities,packages:v},null,2));'
      - name: Enforce dependency security baseline
        run: npm audit --audit-level=moderate
      - name: TypeScript and Vue type check
        run: npm run typecheck
      - name: Unit tests (crypto and Second Brain)
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: lifevault-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
