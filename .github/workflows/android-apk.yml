name: LifeVault Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - lifevault-premium-ui
      - 'personal-commander-*'
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Require production API URL
        env:
          LIFEVAULT_API_BASE: ${{ vars.LIFEVAULT_API_BASE }}
        run: |
          if [ -z "$LIFEVAULT_API_BASE" ]; then
            echo "::error::Set the repository Actions variable LIFEVAULT_API_BASE to the public HTTPS API base ending in /api/v1."
            exit 1
          fi
          case "$LIFEVAULT_API_BASE" in
            https://*) ;;
            *) echo "::error::LIFEVAULT_API_BASE must use HTTPS."; exit 1 ;;
          esac

      - name: Build web app
        env:
          VITE_API_BASE: ${{ vars.LIFEVAULT_API_BASE }}
        run: npm run build

      - name: Generate Android project when absent
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor plugins and assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lifevault-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
